[package]
name = "anydoc_cli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Must resolve to the same anydoc version as ../Cargo.lock (see README, Fuzzing).
anydoc = "0.1"

[[bin]]
name = "convert"
path = "fuzz_targets/convert.rs"
test = false
doc = false
bench = false
